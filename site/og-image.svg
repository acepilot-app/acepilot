<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0a0b"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a1e" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Subtle glow behind logo -->
  <radialGradient id="glow" cx="600" cy="220" r="100" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <circle cx="600" cy="220" r="100" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(564, 160)">
    <rect width="72" height="72" rx="16" fill="#0f172a"/>
    <path fill="#38bdf8" d="M36 9 L13.5 60.75 L36 42.75 L58.5 60.75 Z"/>
  </g>

  <!-- Title -->
  <text x="600" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="#e8e8ed" letter-spacing="-1">
    AcePilot
  </text>

  <!-- Subtitle -->
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#a1a1a6" font-weight="400">
    God Mode for Claude Code
  </text>

  <!-- Agent dots with colors -->
  <g transform="translate(365, 420)">
    <!-- designer -->
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <text x="0" y="24" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#38bdf8">designer</text>

    <!-- security -->
    <circle cx="94" cy="0" r="6" fill="#f43f5e"/>
    <text x="94" y="24" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#f43f5e">security</text>

    <!-- architect -->
    <circle cx="188" cy="0" r="6" fill="#f59e0b"/>
    <text x="188" y="24" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#f59e0b">architect</text>

    <!-- strategist -->
    <circle cx="282" cy="0" r="6" fill="#30d158"/>
    <text x="282" y="24" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#30d158">strategist</text>

    <!-- reviewer -->
    <circle cx="376" cy="0" r="6" fill="#e8e8ed"/>
    <text x="376" y="24" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#e8e8ed">reviewer</text>

    <!-- researcher -->
    <circle cx="470" cy="0" r="6" fill="#a78bfa"/>
    <text x="470" y="24" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#a78bfa">researcher</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="510" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#555" font-weight="400">
    6 specialist agents. Scan to PR in minutes.
  </text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="16" fill="#38bdf8" font-weight="600">
    acepilot.app
  </text>
</svg>